<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookOrbit Notifier</title>
  <link rel="stylesheet" href="/admin-assets/admin.css">
  <script defer src="/admin-assets/admin.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>BookOrbit Notifier</h1>
      <label for="language" data-text="language">Sprache</label>
      <select id="language"><option value="de">Deutsch</option><option value="en">English</option></select>
    </header>
    <p id="message" role="status" aria-live="polite"></p>
    <section id="auth-panel" aria-labelledby="login-title">
      <h2 id="login-title" data-text="login">Anmelden</h2>
      <form id="login-form">
        <label for="password" data-text="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button type="submit" data-text="login">Anmelden</button>
      </form>
      <details>
        <summary data-text="setup">Ersteinrichtung</summary>
        <form id="setup-form">
          <label for="setup-token" data-text="setupToken">Einrichtungsschlüssel</label>
          <input id="setup-token" type="password" autocomplete="off" required maxlength="1024">
          <label for="new-password" data-text="newPassword">Neues Passwort (mindestens 12 Zeichen)</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
          <button type="submit" data-text="createAccount">Administratorkonto erstellen</button>
        </form>
      </details>
    </section>
    <section id="dashboard" aria-labelledby="dashboard-title" hidden>
      <h2 id="dashboard-title" data-text="dashboard">Benachrichtigungen</h2>
      <button id="refresh" type="button" data-text="refresh">Aktualisieren</button>
      <button id="logout" type="button" data-text="logout">Abmelden</button>
      <dl id="counts"></dl>
      <h2 data-text="senderProfile">Absenderprofil</h2>
      <label for="profile-scope" data-text="profileScope">Konfigurationsebene</label>
      <select id="profile-scope"><option value="global" data-text="globalScope">Global</option><option value="webhook" data-text="webhookScope">Webhook</option><option value="library" data-text="libraryScope">Bibliothek</option></select>
      <label for="profile-target" id="profile-target-label" data-text="profileTarget" hidden>Auswahl</label>
      <select id="profile-target" hidden></select>
      <p id="profile-unavailable" data-text="noTargets" hidden>Für diese Ebene ist noch kein Eintrag vorhanden.</p>
      <form id="profile-form">
        <label for="username-choice" data-text="senderName">Absendername</label>
        <select id="username-choice"><option value="inherit" data-text="inherit">Übernehmen</option><option value="original" data-text="original">Webhook-Original</option><option value="custom" data-text="custom">Benutzerdefiniert</option></select>
        <label for="username-value" data-text="nameValue">Benutzerdefinierter Name</label>
        <input id="username-value" type="text" maxlength="80">
        <label for="avatar-choice" data-text="avatar">Profilbild</label>
        <select id="avatar-choice"><option value="inherit" data-text="inherit">Übernehmen</option><option value="original" data-text="original">Webhook-Original</option><option value="custom" data-text="custom">Benutzerdefiniert</option></select>
        <label for="avatar-value" data-text="avatarValue">Öffentliche HTTPS-Bild-URL</label>
        <input id="avatar-value" type="url" maxlength="2048">
        <button type="submit" data-text="save">Speichern</button>
      </form>
      <section aria-labelledby="preview-heading" class="preview-editor">
        <h2 id="preview-heading" data-text="previewTitle">Discord-Live-Vorschau</h2>
        <p data-text="previewHint">Beispieldaten; Änderungen an dieser Vorschau werden nicht gespeichert oder versendet.</p>
        <label for="preview-title" data-text="embedTitle">Titel</label>
        <input id="preview-title" type="text" maxlength="512" value="Neu: {{title}}">
        <label for="preview-description" data-text="embedDescription">Beschreibung</label>
        <textarea id="preview-description" rows="6" maxlength="4000">{{authors}} · {{published_year}}
{{narrators}} · {{page_count}} Seiten</textarea>
        <label for="preview-footer" data-text="embedFooter">Fußzeile</label>
        <input id="preview-footer" type="text" maxlength="512" value="{{library}} · {{server}}">
        <label for="preview-variable" data-text="variable">Variable</label>
        <select id="preview-variable"></select>
        <button type="button" id="insert-variable" data-text="insertVariable">In Beschreibung einfügen</button>
        <div class="discord-preview" aria-live="polite">
          <div class="discord-avatar" aria-hidden="true">B</div>
          <div><strong id="preview-sender">BookOrbit Notifier</strong><div class="discord-embed"><strong id="preview-rendered-title"></strong><p id="preview-rendered-description"></p><small id="preview-rendered-footer"></small></div></div>
        </div>
        <p id="preview-error" role="status"></p>
      </section>
    </section>
  </main>
</body>
</html>
